name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: npm install

    - name: Build TypeScript
      run: npm run build

    - name: Create Python venv and install dependencies
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install -r src/python/requirements.txt
        deactivate

    - name: Package application
      run: npm run package

    - name: Verify DMG created
      run: |
        ls -lh release/*.dmg

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: dmg-package
        path: release/*.dmg
        retention-days: 7

    - name: Run basic smoke tests
      run: |
        # Mount DMG
        hdiutil attach "release/Gemini Video Understanding-${{ github.ref_name }}-arm64.dmg"

        # Check app structure
        ls -la "/Volumes/Gemini Video Understanding/"

        # Verify Python bundle exists
        ls -la "/Volumes/Gemini Video Understanding/Gemini Video Understanding.app/Contents/Resources/python/"

        # Verify FFmpeg binaries exist
        ls -la "/Volumes/Gemini Video Understanding/Gemini Video Understanding.app/Contents/Resources/bin/"

        # Detach DMG
        hdiutil detach "/Volumes/Gemini Video Understanding"
