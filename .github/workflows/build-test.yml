name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Node dependencies
      run: npm install

    - name: Build TypeScript + Webpack
      run: npm run build

    - name: Check Python syntax
      run: python3 -c "import ast; ast.parse(open('src/python/video_transcription_pipeline_v10.py').read()); print('Python syntax OK')"

    - name: Install and verify Python dependencies
      run: |
        pip install -r src/python/requirements.txt
        python3 -c "from google import genai; print('google-genai OK')"
